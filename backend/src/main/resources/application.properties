server.port=8080
server.error.include-message=always

# Your private settings (email password, Google ID, demo email) go in backend/config/local.properties.
# That file is not shared (see local.properties.example for what to put in it). It is optional.
spring.config.import=optional:file:backend/config/local.properties,optional:file:config/local.properties

# Local database: a file under backend/data/, created on first run. For PostgreSQL change these three lines.
spring.datasource.url=jdbc:h2:file:./data/dukaan;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# "Continue with Google" needs a Google client ID (see the README). Set it as the GOOGLE_CLIENT_ID environment variable.
google.client-id=${GOOGLE_CLIENT_ID:}

# Login codes: how long a code works (seconds). A new code can be asked for after half of this time.
dukaan.code-valid-seconds=60

# Sending the code by email. Until spring.mail.host is set (in local.properties) no email is sent:
# the code is printed in this window instead. These just stop a slow mail server from hanging a login.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# An email address that opens the demo shop (Sharma General Store, with all its sample data). Optional.
dukaan.demo-email=${DEMO_EMAIL:}

# Demo logins for a hackathon or a video: phone:code pairs. Each phone always logs in with its code, so nobody needs to read the server log.
# 9999900001 = Rajesh Sharma (Sharma General Store), 9999900002 = Anita Mehra (Bright Stationery House). The codes are public in this repo,
# so set the DEMO_LOGINS environment variable to something else (or to a single "-") when real people use the app.
dukaan.demo-logins=${DEMO_LOGINS:9999900001:123456,9999900002:123456}

# Uploaded voice notes and call recordings: where they are kept, and the biggest file accepted.
dukaan.recordings-dir=./data/recordings
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Speech (Gnani Vachana): speech-to-text and text-to-speech. The key is private: put gnani.api-key=... in
# backend/config/local.properties (or set the GNANI_API_KEY environment variable). Without a key the browser's own speech is used.
gnani.stt-language=indic-auto
# Text-to-speech always uses Gnani's timbre-v3.0; each person chooses the voice on the Settings page (see voice/VoiceCatalog.java)
gnani.tts-language=hi-en

# Folder with the sample CSVs; they are loaded once, when the database is empty.
dukaan.seed-dir=../db

# The sample data ends on 18 Oct 2026, so the demo treats that day as "today".
# Delete this line to use the real date.
dukaan.today=2026-10-18
