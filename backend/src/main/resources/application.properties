server.port=8080
server.error.include-message=always

# Local database: a file under backend/data/, created on first run. For PostgreSQL change these three lines.
spring.datasource.url=jdbc:h2:file:./data/dukaan;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# "Continue with Google" needs a Google client ID (see the README). Set it as the GOOGLE_CLIENT_ID environment variable.
google.client-id=${GOOGLE_CLIENT_ID:}

# Folder with the sample CSVs; they are loaded once, when the database is empty.
dukaan.seed-dir=../db

# The sample data ends on 18 Oct 2026, so the demo treats that day as "today".
# Delete this line to use the real date.
dukaan.today=2026-10-18
